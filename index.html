    <!--
      Fonts are self-hosted as latin-subset woff2 (~144 kB for the whole family
      set) rather than fetched from a third-party origin. Only the two faces the
      first screen actually needs are preloaded; the rest load on use.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-tight-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://www.aagesengrowth.dk/#organisation",
        "name": "Aagesen Growth ApS",
        "legalName": "Aagesen Growth ApS",
        "description": "Digital vækstpartner for små og mellemstore virksomheder. Websites og konvertering, Google Ads, Meta Ads, Search Visibility (SEO og GEO/AI-synlighed), tracking og drift hos én ansvarlig partner.",

        "areaServed": "DK",
        "knowsLanguage": "da",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Digitale ydelser",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Websites & Conversion",
                "description": "Websites bygget til at skabe tillid og henvendelser, med konverteringspunkter, mobil-performance og måleklar opsætning."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Google Ads",
                "description": "Struktureret annoncering mod den aktive efterspørgsel med konverteringssporing og løbende optimering."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Meta Ads",
                "description": "Kampagner på Facebook og Instagram med målgrupper, retargeting og løbende justering."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Search Visibility",
                "description": "SEO og GEO/AI-synlighed: teknisk SEO, søgeintention, struktureret indhold og schema, så virksomheden både findes i søgeresultater og bruges som kilde i AI-assisteret søgning."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Digital Growth",
                "description": "Tracking og analyse, strategisk prioritering, konverteringsoptimering og løbende vækstsamarbejde."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Hosting og vedligeholdelse" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "WooCommerce-optimering" }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <!--
      Static form declaration for Netlify Forms. The build-time crawler reads
      the field names from here; the live form is rendered by React on /kontakt
      and must keep exactly these names.
    -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="website" />
      <select name="help"><option value=""></option></select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
