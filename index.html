<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F6F2" />

    <meta
      name="description"
      content="Growth Engine finder de steder i jeres digitale kunderejse, hvor potentielle kunder går tabt, og forbedrer det, der betyder mest. Kør en gratis Growth Scan, eller book en afklaring."
    />
    <link rel="canonical" href="https://aagesengrowth.com/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="alternate" hreflang="da-DK" href="https://aagesengrowth.com/" />
    <link rel="alternate" hreflang="en" href="https://aagesengrowth.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://aagesengrowth.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Aagesen Growth" />
    <meta property="og:url" content="https://aagesengrowth.com/" />
    <meta property="og:title" content="Growth Engine: find hvor I taber kunder" />
    <meta
      property="og:description"
      content="Find de steder i jeres digitale kunderejse, hvor potentielle kunder går tabt. Kør en gratis Growth Scan."
    />
    <meta property="og:image" content="https://aagesengrowth.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aagesen Growth — Growth Engine. Flere kunder. Færre tabte leads." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Growth Engine: find hvor I taber kunder" />
    <meta
      name="twitter:description"
      content="Find de steder i jeres digitale kunderejse, hvor potentielle kunder går tabt. Kør en gratis Growth Scan."
    />
    <meta name="twitter:image" content="https://aagesengrowth.com/og-image.jpg" />

    <!--
      Fonts are self-hosted as latin-subset woff2. Inter Tight is a single
      variable file covering 100–900. Only the two faces the first screen
      needs are preloaded; the mono loads on use.
    -->
    <link rel="preload" href="/fonts/inter-tight-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Organisation + Service structured data for the entry document. The
      React app re-emits the same entities per route (see SEOHead.tsx); this
      copy is what a crawler sees before any JavaScript runs.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aagesengrowth.com/#organization",
            "name": "Aagesen Growth",
            "legalName": "Aagesen Growth ApS",
            "url": "https://aagesengrowth.com",
            "logo": "https://aagesengrowth.com/brand/aagesen-growth.png",
            "description": "Growth Engine finder og forbedrer de steder i den digitale kunderejse, hvor danske servicevirksomheder taber potentielle kunder.",
            "areaServed": "DK",
            "knowsLanguage": ["da", "en"]
          },
          {
            "@type": "Service",
            "@id": "https://aagesengrowth.com/#growth-engine",
            "name": "Growth Engine",
            "serviceType": "Identifikation og løbende forbedring af den digitale kunderejse for servicevirksomheder",
            "provider": { "@id": "https://aagesengrowth.com/#organization" },
            "areaServed": "DK",
            "offers": {
              "@type": "Offer",
              "priceCurrency": "DKK",
              "price": 5995,
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "priceCurrency": "DKK",
                "price": 5995,
                "unitText": "MONTH",
                "valueAddedTaxIncluded": false
              },
              "url": "https://aagesengrowth.com/pris"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Static form declaration for Netlify Forms. The build-time crawler reads
      the field names from here; the live form is rendered by React (see
      components/scan/LeadForm.tsx) and must keep exactly these names. The
      scan-* fields carry the Growth Scan context of a lead into the
      submission.
    -->
    <form name="growth-review" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="growth-review" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="website" />
      <input name="source" />
      <input name="intake_id" />
      <input name="need" />
      <input name="timeline" />
      <input name="budget" />
      <input name="preferred_channel" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_content" />
      <input name="utm_term" />
      <input name="referrer" />
      <input name="founder" />
      <input name="scan-id" />
      <input name="scan-score" />
      <textarea name="scan-summary"></textarea>
    </form>

    <!--
      "Bliv ringet op" (components/forms/CallbackForm.tsx). Same rule: the
      field names here and in the component must match. Netlify emails each
      submission to kontakt@aagesengrowth.dk via a form notification, and the
      `subject` field becomes the email subject.
    -->
    <form name="callback" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="callback" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="phone" />
      <input name="email" />
      <textarea name="message"></textarea>
      <input name="source" />
      <input name="intake_id" />
      <input name="need" />
      <input name="timeline" />
      <input name="budget" />
      <input name="preferred_channel" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_content" />
      <input name="utm_term" />
      <input name="referrer" />
      <input name="page" />
      <input name="scan-url" />
      <input name="scan-id" />
      <input name="submitted-at" />
      <input name="subject" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
